<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles.css">
    <title>Early Disease Detection</title>
</head>
<body>
    <div class="container">
        <!-- Upload Section -->
        <section class="upload-section">
            <h2>Upload Data</h2>
            <div class="input-group">
                <label for="healthData">Health Data (CSV):</label>
                <input type="file" id="healthData" name="healthData" accept=".csv" required>
            </div>
            <div class="input-group">
                <label for="activityData">Activity Environment Data (CSV):</label>
                <input type="file" id="activityData" name="activityData" accept=".csv" required>
            </div>
            <div class="input-group">
                <label for="digitalInteractionData">Digital Interaction Data (CSV):</label>
                <input type="file" id="digitalInteractionData" name="digitalInteractionData" accept=".csv" required>
            </div>
            <div class="input-group">
                <label for="personalHealthData">Personal Health Data (CSV):</label>
                <input type="file" id="personalHealthData" name="personalHealthData" accept=".csv" required>
            </div>
        </section>

        <!-- Train Model Button -->
        <section class="action-section">
            <h2>Train the Model</h2>
            <form id="trainingForm" onsubmit="trainModel(event)" enctype="multipart/form-data">
                <button type="submit" class="train-btn">🚀 Train Model</button>
            </form>
            <!-- Loading Spinner Section -->
            <div id="spinnerSection" class="hidden" style="display: none;">
                <div class="spinner"></div>
                <p id="spinnerMessage">Training the model... Please wait.</p>
                <progress id="trainingProgress" value="0" max="100"></progress>
            </div>
        </section>

        <!-- Output Section -->
        <section id="output" class="hidden">
            <h2>Model Results</h2>
            <div id="visualizations" class="visualization-container"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
